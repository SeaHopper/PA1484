; PlatformIO wrapper for the LilyGO T4-S3 LVGL MicroPython template.

[platformio]
default_envs = t4s3-micropython
src_dir = project
boards_dir = boards

[env:t4s3-micropython]
targets = build_app_fs
platform = espressif32@6.7.0
board = T-Display-AMOLED
; The T4-S3 flashes over the ESP32-S3 native USB-CDC port, where the baud rate
; is virtual. Renegotiating to a faster rate drops the connection mid-upload,
; so keep this at 115200 even though a UART bridge would tolerate more.
upload_speed = 115200
monitor_speed = 115200
upload_protocol = custom
extra_scripts = pre:platformio/deploy.py

; Builds the FAT image written to the vfs partition. Not part of the espressif32
; platform, so it must be requested explicitly or deploy.py cannot package.
platform_packages = platformio/tool-mkfatfs@^2.0.1

; PlatformIO requires a linkable source for its standard Upload task. This
; inert stub is never flashed; deploy.py replaces the uploader.
build_src_filter = -<*> +<pio_upload_stub.c>
